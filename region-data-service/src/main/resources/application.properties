spring.application.name=region-data-service
spring.profiles.active=${ACTIVE_PROFILE:local}

######### BDL #########
bdl.api.url=https://bdl.stat.gov.pl/api/v1
bdl.api.key=${BDL_API_KEY}

######### Metrics #########
management.endpoints.web.exposure.include=health,info,prometheus,loggers
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=https://otlp-gateway-prod-eu-west-2.grafana.net/otlp/v1/metrics
management.otlp.metrics.export.headers.authorization=${OTEL_API_KEY}
management.otlp.metrics.export.step=60s
management.opentelemetry.resource-attributes.deployment.environment=${ACTIVE_PROFILE:local}

######### Logs #########
management.logging.export.otlp.enabled=true
management.opentelemetry.logging.export.otlp.endpoint=https://otlp-gateway-prod-eu-west-2.grafana.net/otlp/v1/logs
management.opentelemetry.logging.export.otlp.headers.authorization=${OTEL_API_KEY}

######### Tracing #########
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=https://otlp-gateway-prod-eu-west-2.grafana.net/otlp/v1/traces
management.opentelemetry.tracing.export.otlp.headers.authorization=${OTEL_API_KEY}
